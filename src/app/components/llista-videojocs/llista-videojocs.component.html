
<!-- Component que mostra el conjunt de videojocs -->

<section aria-label="Llistat de videojocs">
    <h2>Catàleg de videojocs</h2>

    <!-- Recorrem l'array rebut del component pare -->
    @for (videojoc of videojocs; track videojoc.id) {

        <!-- Rebem l'esdeveniment de selecció emès per la targeta-->
        <app-targeta-videojoc
            [videojoc]="videojoc"
            (seleccionar)="notificarSeleccio($event)">
        </app-targeta-videojoc>
    }
</section>
